# Phase 8 — local Prometheus scrape config for the observability demo
# stack (see docker-compose.observability.yml). Points at the "api"
# service's /metrics/prometheus endpoint (src/serving/app.py).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: complaint-intelligence-platform
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["api:8000"]
